# What the operator may do, and nothing beyond it.
#
# Two things it deliberately cannot do, both of which an operator is often
# given by reflex:
#
#   - Read Secrets. It names them in a pod spec and never reads their
#     contents; the kubelet resolves them. An operator that could read every
#     Secret in the cluster is a much larger blast radius than one that
#     cannot, for no gain here.
#   - Touch anything outside the objects it creates. No node access, no
#     namespace creation, no cluster-scoped writes other than the CRD status.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastllm-operator
  namespace: fastllm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fastllm-operator
rules:
  - apiGroups: ["fastllm.io"]
    resources: ["fastllmproxies"]
    verbs: ["get", "list", "watch"]
  # Status is a subresource with its own rule, so the controller can report
  # what it observes without being able to rewrite the spec it was given.
  - apiGroups: ["fastllm.io"]
    resources: ["fastllmproxies/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events are how a reconcile failure reaches `kubectl describe`.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fastllm-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fastllm-operator
subjects:
  - kind: ServiceAccount
    name: fastllm-operator
    namespace: fastllm-system
