apiVersion: v1
kind: Namespace
metadata:
  name: fastllm-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastllm-operator
  namespace: fastllm-system
  labels:
    app.kubernetes.io/name: fastllm-operator
spec:
  replicas: 1
  # One replica and Recreate: this controller has no leader election, so two
  # would both reconcile the same resources and fight over the same fields.
  # Saying so here is cheaper than adding a lease nobody needs at this size.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: fastllm-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastllm-operator
    spec:
      serviceAccountName: fastllm-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: ghcr.io/azrtydxb/fastllm-operator:v0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: FASTLLM_OPERATOR_LOG
              value: info
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
