                type: string
              controlReady:
                default: false
                description: Whether the control plane has a ready replica.
                type: boolean
              observedGeneration:
                default: 0
                description: The generation this status describes. A status whose `observedGeneration` trails `metadata.generation` is a reconcile that has not landed yet, which is the difference between "converged" and "not looked at".
                format: int64
                type: integer
              observedImage:
                default: ''
                description: 'The image actually serving traffic, which during an ordered upgrade is not yet `spec.image` — and never will be if the new one cannot be pulled. Printed instead of the spec for exactly that reason: the interesting number is what is running, not what was asked for.'
                type: string
              phase:
                default: ''
                description: 'One word for `kubectl get`: `Pending`, `Upgrading`, `Bootstrapping`, `Degraded` or `Ready`. The conditions carry the detail.'
                type: string
              proxyReplicas:
                default: ''
                description: '`ready/desired`, so a partially rolled-out gateway is visible in `kubectl get` without a second command.'
                type: string
            type: object
