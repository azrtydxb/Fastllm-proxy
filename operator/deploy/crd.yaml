          status:
            description: What the controller last observed. Every field here is measured, not echoed back from the spec — a status that repeats the spec tells an operator nothing they did not already type.
            nullable: true
            properties:
              bootstrapped:
                default: false
                description: 'Whether the bootstrap Job has completed. Never reset by the controller: re-running it is a password reset, and a controller that does that on its own is a controller that can lock an operator out.'
                type: boolean
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
