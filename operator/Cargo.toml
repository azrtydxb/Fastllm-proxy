[package]
name = "fastllm-operator"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Kubernetes operator for fastllm-proxy"
license = "Apache-2.0"

[lib]
name = "fastllm_operator"
path = "src/lib.rs"

[[bin]]
name = "fastllm-operator"
path = "src/main.rs"

# Emits the CRD YAML from the same Rust types the controller reconciles, so
# the manifest in deploy/ cannot drift from the struct. `cargo run -p
# fastllm-operator --bin crdgen > operator/deploy/crd.yaml`.
[[bin]]
name = "crdgen"
path = "src/crdgen.rs"

[dependencies]
kube = { version = "0.99", default-features = false, features = [
    "client",
    "derive",
    "runtime",
    "rustls-tls",
] }
k8s-openapi = { version = "0.24", features = ["latest", "schemars"] }
schemars = "0.8"
# Named directly only to choose the crypto provider — see main(). Without it
# rustls panics at the first TLS handshake because more than one provider
# feature is enabled somewhere in the tree.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
