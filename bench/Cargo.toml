[package]
name = "bench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "upstream"
path = "src/upstream.rs"

[[bin]]
name = "realbench"
path = "src/realbench.rs"

[[bin]]
name = "proto"
path = "src/proto.rs"

[[bin]]
name = "tcprelay"
path = "src/tcprelay.rs"

[[bin]]
name = "micro"
path = "src/micro.rs"

[[bin]]
name = "load"
path = "src/load.rs"

# Evaluates Model2Vec static embedding models as a routing classifier (see
# `src/potion.rs`). Lives in `bench` rather than the proxy so the decision of
# *whether* to embed a model at all stays separable from the proxy's own
# dependency tree — nothing here ships in the image.
[[bin]]
name = "potion"
path = "src/potion.rs"

# The same evaluation against real labelled data (HuggingFaceH4/no_robots and
# openai/gsm8k) rather than hand-written prompts — see `src/potion_real.rs`.
# Run `python3 bench/fetch-prompts.py` first.
[[bin]]
name = "potion-real"
path = "src/potion_real.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "server", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
model2vec-rs = "0.2"
