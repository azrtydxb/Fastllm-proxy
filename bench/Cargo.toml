[package]
name = "bench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "upstream"
path = "src/upstream.rs"

[[bin]]
name = "realbench"
path = "src/realbench.rs"

[[bin]]
name = "proto"
path = "src/proto.rs"

[[bin]]
name = "tcprelay"
path = "src/tcprelay.rs"

[[bin]]
name = "tailparse"
path = "src/tailparse.rs"

[[bin]]
name = "micro"
path = "src/micro.rs"

[[bin]]
name = "load"
path = "src/load.rs"

# Measures a candidate tier-2 model against the splits a static embedding
# cannot do — see `src/minilm.rs`. The one classifier instrument kept after
# the model-selection experiments were retired: their conclusions live in
# `docs/classifier/measurements.md`, but choosing a *new* model still needs
# something to measure it with. Lives in `bench` rather than the proxy so the
# decision of whether to embed a model at all stays separable from the proxy's
# own dependency tree — nothing here ships in the image.
[[bin]]
name = "minilm"
path = "src/minilm.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "server", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
fastllm-proxy = { path = "..", default-features = false, features = ["classifier"] }
# Real transformer embeddings (ONNX via `ort`), for the tier-2 half of the
# cascade experiment only. A heavy native dependency, which is precisely why it
# lives in `bench` and not in the proxy until the measurement justifies it.
fastembed = "5"
