# Portable base. Applies to any cluster:
#
#   kubectl apply -k deploy/kubernetes/base/base/
#
# It deliberately refuses to start without two Secrets you create yourself —
# see this directory's README. Generating them here would put a proxy token
# and an encryption key in git, and the encryption key is not regenerable.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fastllm

resources:
  - namespace.yaml
  - configmap.yaml
  - control.yaml
  - proxy.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: fastllm-proxy
      app.kubernetes.io/version: v0.2.0

# One place to change the tag for both planes. They share a database schema,
# so a proxy older than its control plane reads a snapshot with fields it does
# not understand — never pin them apart.
images:
  - name: ghcr.io/azrtydxb/fastllm-proxy
    newTag: v0.2.0
