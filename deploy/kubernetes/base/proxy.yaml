# The data plane. This is the part that scales.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastllm-proxy
  labels:
    app.kubernetes.io/name: fastllm-proxy
    app.kubernetes.io/component: proxy
spec:
  replicas: 2
  # maxUnavailable: 0 — a rollout never takes the gateway below its current
  # capacity, it only adds.
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: fastllm-proxy
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastllm-proxy
        app.kubernetes.io/component: proxy
    spec:
      # A gateway that dies with one node is not a gateway. ScheduleAnyway
      # rather than DoNotSchedule so a single-node cluster still runs both.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fastllm-proxy
              app.kubernetes.io/component: proxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
        # emptyDir volumes are created root-owned by the kubelet, and
        # readOnlyRootFilesystem leaves no other writable path for the
        # snapshot cache.
        fsGroup: 65532
      containers:
        - name: proxy
          image: ghcr.io/azrtydxb/fastllm-proxy:v0.2.0
          args:
            - --role=proxy
            - --policy=cache-affinity
            # Bounds time to response *headers* only. A long generation is not
            # a hung request.
            - --upstream-timeout=120
            - --health-interval=10
          ports:
            - { name: http, containerPort: 4000 }
          env:
            # Plain http:// inside the cluster. /snapshot carries usable
            # upstream credentials, so put TLS in front of it wherever a
            # backend has a real one — overlays/tls/ does exactly that, and
            # docs/security.md says why it is not optional there.
            - name: FASTLLM_CONTROL_URL
              value: http://fastllm-control:4001/snapshot
            - name: FASTLLM_PROXY_TOKEN
              valueFrom:
                secretKeyRef: { name: fastllm-secrets, key: proxy-token }
            - name: FASTLLM_LOG
              value: info
          volumeMounts:
            # The `fastllm:` tuning block only — models and keys come from the
            # control plane in this mode.
            - { name: config, mountPath: /etc/fastllm, readOnly: true }
            # Last-known-good snapshot. A proxy that restarts while the
            # control plane is down starts serving from this instead of coming
            # up with nothing — which is the whole point of the fallback.
            # Ephemeral by design: a pod that never started has no cache to
            # fall back to anyway.
            - { name: snapshot-cache, mountPath: /var/lib/fastllm }
          # Readiness tracks backends — /health answers 503 with none healthy,
          # which correctly pulls this pod out of the Service. Liveness must
          # NOT use it: a backend outage would then restart-loop a perfectly
          # healthy proxy. /metrics answers whenever the process is alive.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /metrics, port: http }
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /metrics, port: http }
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            # 85Mi serving without classification; 268Mi once a refined class
            # loads the ONNX session lazily.
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      # Under --shutdown-grace (25s), so in-flight generations finish before
      # the kubelet SIGKILLs.
      terminationGracePeriodSeconds: 40
      volumes:
        - name: config
          configMap: { name: fastllm-proxy-config }
        - name: snapshot-cache
          emptyDir: {}
---
# ClusterIP by default: how traffic reaches this is a per-cluster decision.
# Change to LoadBalancer, or put an Ingress in front — overlays/loadbalancer/
# is the one-line version.
apiVersion: v1
kind: Service
metadata:
  name: fastllm-proxy
  labels:
    app.kubernetes.io/name: fastllm-proxy
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fastllm-proxy
    app.kubernetes.io/component: proxy
  ports:
    - { name: http, port: 4000, targetPort: http }
---
# Keeps a rolling node drain from taking the whole gateway with it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fastllm-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fastllm-proxy
      app.kubernetes.io/component: proxy
