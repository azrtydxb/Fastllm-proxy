apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastllm-proxy
  namespace: fastllm
  labels: { app: fastllm-proxy }
spec:
  replicas: 2
  selector:
    matchLabels: { app: fastllm-proxy }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: fastllm-proxy }
    spec:
      # Two replicas on different nodes: a gateway that dies with one node is
      # not a gateway. Prefix affinity is per-process, so two replicas means a
      # prefix can land on either — acceptable at one backend, worth revisiting
      # if the backend pool grows and cache locality starts to matter.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: fastllm-proxy }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
        # The emptyDir below needs to be group-writable by the container's
        # uid: emptyDir volumes are created root-owned by the kubelet, and
        # readOnlyRootFilesystem means there is no other writable path for
        # the snapshot cache to land in.
        fsGroup: 65532
      containers:
        - name: proxy
          # Port 443, not the :5000 that CI pushes to. Zot serves both, but
          # every other workload on this cluster pulls via 443 and that is what
          # containerd is configured to trust.
          # Must match control.yaml's pin — the two share a database schema, and
          # a proxy older than the control plane reads a snapshot with fields it
          # does not know. See the note there for why this drifted from the
          # running image and what applying the stale pin did.
          image: 192.168.10.123/azrtydxb/fastllm-proxy/proxy:sha-d264adb
          imagePullPolicy: Always
          args:
            - --role=proxy
            - --policy=cache-affinity
            # spark2 holds 262k context and generations run long; bound only
            # time-to-first-byte, never the generation itself.
            - --upstream-timeout=120
            - --health-interval=10
            # `fastllm-control`'s cert is issued by `cluster-ca`
            # (control.yaml), a private in-cluster CA no public root store
            # trusts — without this, the TLS handshake to `/snapshot` and
            # `/usage` fails closed.
            - --ca-bundle=/etc/fastllm/ca/ca.crt
          ports:
            - { name: http, containerPort: 4000 }
          env:
            # Http mode: models, backends and keys come from fastllm-control,
            # not from the ConfigMap below. `config` is still mounted for the
            # optional `fastllm:` tuning block only (see configmap.yaml).
            # `https://` + `/snapshot`: `/snapshot` carries usable upstream
            # backend credentials (model_backends.upstream_api_key), so this
            # must be TLS wherever a backend has a real one, which this
            # cluster's do — see control.yaml's `fastllm-control-tls`
            # `Certificate`. `POST /usage`'s URL is derived from this one
            # (main.rs's `usage_url`), not a second flag that could drift.
            - name: FASTLLM_CONTROL_URL
              value: https://fastllm-control.fastllm.svc:4001/snapshot
            - name: FASTLLM_PROXY_TOKEN
              valueFrom:
                secretKeyRef: { name: fastllm-proxy-token, key: token }
            - name: FASTLLM_LOG
              value: info
          volumeMounts:
            - { name: config, mountPath: /etc/fastllm, readOnly: true }
            # Snapshot disk cache (default /var/lib/fastllm/snapshot.json).
            # A restarted proxy reads its last-known-good snapshot from here
            # and starts serving even if fastllm-control is unreachable —
            # readOnlyRootFilesystem means this has to be an explicit volume,
            # not just "the container filesystem". Ephemeral by design: a
            # pod that has never started has no cache to fall back to
            # regardless, so nothing is lost by not persisting this across
            # rescheduling.
            - { name: snapshot-cache, mountPath: /var/lib/fastllm }
            # Only `ca.crt` out of fastllm-control-tls (never `tls.key`,
            # which this pod has no use for and no business holding) — see
            # the `items` selector below.
            - { name: control-ca, mountPath: /etc/fastllm/ca, readOnly: true }
          # Readiness tracks backends: /health is 503 with none healthy, which
          # correctly pulls this pod out of the Service. Liveness must NOT use
          # it — spark2 being down would then restart-loop a perfectly healthy
          # proxy — so it probes /metrics, which answers whenever the process
          # is alive.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /metrics, port: http }
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /metrics, port: http }
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            # 85Mi serving without classification; 268Mi measured once a refined
            # class caused the ONNX session to load lazily. 1Gi leaves room for
            # that without inviting a pod to grow into it unnoticed.
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: fastllm-proxy-config }
        - name: snapshot-cache
          emptyDir: {}
        - name: control-ca
          secret:
            secretName: fastllm-control-tls
            items:
              - { key: ca.crt, path: ca.crt }
