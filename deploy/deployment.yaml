apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastllm-proxy
  namespace: fastllm
  labels: { app: fastllm-proxy }
spec:
  replicas: 2
  selector:
    matchLabels: { app: fastllm-proxy }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: fastllm-proxy }
    spec:
      # Two replicas on different nodes: a gateway that dies with one node is
      # not a gateway. Prefix affinity is per-process, so two replicas means a
      # prefix can land on either — acceptable at one backend, worth revisiting
      # if the backend pool grows and cache locality starts to matter.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: fastllm-proxy }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
        # The emptyDir below needs to be group-writable by the container's
        # uid: emptyDir volumes are created root-owned by the kubelet, and
        # readOnlyRootFilesystem means there is no other writable path for
        # the snapshot cache to land in.
        fsGroup: 65532
      containers:
        - name: proxy
          # Port 443, not the :5000 that CI pushes to. Zot serves both, but
          # every other workload on this cluster pulls via 443 and that is what
          # containerd is configured to trust.
          image: 192.168.10.123/azrtydxb/fastllm-proxy/proxy:main
          imagePullPolicy: Always
          args:
            - --role=proxy
            - --policy=cache-affinity
            # spark2 holds 262k context and generations run long; bound only
            # time-to-first-byte, never the generation itself.
            - --upstream-timeout=120
            - --health-interval=10
          ports:
            - { name: http, containerPort: 4000 }
          env:
            # Http mode: models, backends and keys come from fastllm-control,
            # not from the ConfigMap below. `config` is still mounted for the
            # optional `fastllm:` tuning block only (see configmap.yaml).
            - name: FASTLLM_CONTROL_URL
              value: http://fastllm-control.fastllm.svc:4001
            - name: FASTLLM_PROXY_TOKEN
              valueFrom:
                secretKeyRef: { name: fastllm-proxy-token, key: token }
            - name: FASTLLM_LOG
              value: info
          volumeMounts:
            - { name: config, mountPath: /etc/fastllm, readOnly: true }
            # Snapshot disk cache (default /var/lib/fastllm/snapshot.json).
            # A restarted proxy reads its last-known-good snapshot from here
            # and starts serving even if fastllm-control is unreachable —
            # readOnlyRootFilesystem means this has to be an explicit volume,
            # not just "the container filesystem". Ephemeral by design: a
            # pod that has never started has no cache to fall back to
            # regardless, so nothing is lost by not persisting this across
            # rescheduling.
            - { name: snapshot-cache, mountPath: /var/lib/fastllm }
          # Readiness tracks backends: /health is 503 with none healthy, which
          # correctly pulls this pod out of the Service. Liveness must NOT use
          # it — spark2 being down would then restart-loop a perfectly healthy
          # proxy — so it probes /metrics, which answers whenever the process
          # is alive.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /metrics, port: http }
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /metrics, port: http }
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "2", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: fastllm-proxy-config }
        - name: snapshot-cache
          emptyDir: {}
