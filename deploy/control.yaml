# The control plane: database, admin API (`POST /admin/keys`, `DELETE
# /admin/keys/{id}`) and `/snapshot` for the proxy to poll. No proxy listener
# lives here — that is deploy/deployment.yaml, `--role=proxy`.
#
# SECURITY: the admin API has NO authentication of its own today (sessions
# and passwords land later, with the management UI — see TODO.md and the
# design spec). Anyone who can reach port 4001 can mint an API key. The
# Service below is therefore ClusterIP only, and MUST NOT be merged into
# fastllm-proxy's LoadBalancer Service in deploy/service.yaml, which is
# reachable from the whole LAN at 192.168.10.126. Putting /admin on that VIP
# means unauthenticated key creation from anywhere on the network. See
# deploy/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: fastllm-proxy-token
  namespace: fastllm
type: Opaque
stringData:
  # Shared secret between control and proxy: the proxy presents it as a
  # bearer token to GET /snapshot, which is the only route that checks it.
  # /admin/* checks nothing at all (see the SECURITY note above) — this
  # token authenticates the proxy's polling, it is not a substitute for real
  # admin auth and does not gate /admin/* in any way. Placeholder value
  # below; replace it before first deploy the same way fastllm-proxy-auth is
  # generated in the README, then re-apply. Rotating it requires restarting
  # both fastllm-control and fastllm-proxy.
  token: "REPLACE-ME-openssl-rand-hex-32"
---
# Encrypts model_backends.upstream_api_key at rest (control::secrets,
# AES-256-GCM) — see the FASTLLM_ENCRYPTION_KEY env var below and
# README.md's "Encryption at rest" section for exactly what this does and
# does not protect. `fastllm-control` refuses to start without this key
# rather than falling back to storing credentials in plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: fastllm-encryption-key
  namespace: fastllm
type: Opaque
stringData:
  # 32 bytes, hex-encoded (`EncryptionKey::from_hex`). Placeholder value
  # below; replace it before first deploy the same way fastllm-proxy-token
  # is, then re-apply. Rotating it is NOT just a matter of restarting
  # fastllm-control: every row already encrypted under the old key needs
  # decrypting under the old key and re-encrypting under the new one before
  # the swap, which this repo has no automation for yet — treat rotation as
  # a maintenance operation, not a config change.
  key: "REPLACE-ME-openssl-rand-hex-32"
---
# `/snapshot` carries usable upstream backend credentials (see
# model_backends.upstream_api_key's schema comment) and `/usage` is gated by
# the same bearer token as `/snapshot` — both must be TLS in any deployment
# where a backend has a real credential, which this cluster's is. `cluster-ca`
# is the in-cluster ClusterIssuer already used for other internal services
# (see e.g. novamail); cert-manager writes `tls.crt`/`tls.key` (mounted by
# fastllm-control below) and `ca.crt` (mounted by fastllm-proxy in
# deployment.yaml as its `--ca-bundle`, since `cluster-ca` is a private CA no
# public root store trusts) into one Secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fastllm-control-tls
  namespace: fastllm
spec:
  secretName: fastllm-control-tls
  issuerRef: { name: cluster-ca, kind: ClusterIssuer }
  dnsNames:
    - fastllm-control.fastllm.svc
    - fastllm-control.fastllm.svc.cluster.local
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fastllm-pg
  namespace: fastllm
spec:
  # One instance, not the 3-instance HA pattern used elsewhere on kw
  # (novamail-pg): a control plane outage already degrades gracefully — the
  # proxy keeps serving from its last-known-good snapshot cache (see the
  # emptyDir mount in deployment.yaml) — so paying for synchronous replicas
  # here buys less than it costs. Revisit if that assumption stops holding.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  bootstrap:
    initdb:
      database: fastllm
      owner: fastllm
  # CNPG generates fastllm-pg-app with username/password/host/port/dbname
  # and a ready-made `uri` key — that `uri` is what fastllm-control's
  # FASTLLM_DATABASE_URL reads below, so there is no second place a DB
  # credential is copied to or can drift from what CNPG issued.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastllm-control
  namespace: fastllm
  labels: { app: fastllm-control }
spec:
  replicas: 1
  selector:
    matchLabels: { app: fastllm-control }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: fastllm-control }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: control
          image: 192.168.10.123/azrtydxb/fastllm-proxy/proxy:main
          imagePullPolicy: Always
          args:
            - --role=control
            - --admin-port=4001
            - --tls-cert=/etc/fastllm/tls/tls.crt
            - --tls-key=/etc/fastllm/tls/tls.key
          ports:
            - { name: admin, containerPort: 4001 }
          env:
            - name: FASTLLM_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: fastllm-pg-app, key: uri }
            - name: FASTLLM_PROXY_TOKEN
              valueFrom:
                secretKeyRef: { name: fastllm-proxy-token, key: token }
            - name: FASTLLM_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: fastllm-encryption-key, key: key }
            - name: FASTLLM_LOG
              value: info
          volumeMounts:
            # cert-manager-issued cert/key for `/snapshot` + `/usage`, from
            # the `Certificate` above. `readOnlyRootFilesystem` below means
            # this has to be an explicit volume, same reasoning as
            # deployment.yaml's snapshot-cache mount.
            - { name: tls, mountPath: /etc/fastllm/tls, readOnly: true }
          # `/admin/*` (POST/DELETE) has no authentication at all, but it's a
          # mutating endpoint, not a health check, so it's not a valid probe
          # target either. `/snapshot` requires the proxy token, which the
          # kubelet doesn't have. There is no `/health`/`/metrics` here the
          # way the proxy role has. A TCP check on the admin port is the
          # honest probe until this role grows a dedicated `/healthz` — it
          # stays a plain TCP check even now that the port is TLS, since a
          # kubelet probe has no simple way to speak TLS with a private CA.
          readinessProbe:
            tcpSocket: { port: admin }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: admin }
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            tcpSocket: { port: admin }
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: tls
          secret: { secretName: fastllm-control-tls }
---
# ClusterIP only — deliberately not a LoadBalancer and deliberately not on
# fastllm-proxy's VIP. See the SECURITY note at the top of this file.
apiVersion: v1
kind: Service
metadata:
  name: fastllm-control
  namespace: fastllm
  labels: { app: fastllm-control }
spec:
  type: ClusterIP
  selector: { app: fastllm-control }
  ports:
    - { name: admin, port: 4001, targetPort: admin }
