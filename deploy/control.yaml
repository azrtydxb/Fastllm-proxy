# The control plane: database, admin API (`POST /admin/keys`, `DELETE
# /admin/keys/{id}`), the management UI (`/`, `/ui/*`) and `/snapshot` for the
# proxy to poll. No proxy listener lives here — that is deploy/deployment.yaml,
# `--role=proxy`.
#
# SECURITY: this Service is LAN-reachable at 192.168.10.129, and everything
# it serves is authenticated over TLS — `/admin/*` and the UI by a session
# cookie (`POST /login`, Argon2id-checked against principals.password_hash;
# see src/control/auth.rs and README.md's "Admin authentication"),
# `/snapshot` by the proxy token. The reasoning for exposing it, and the
# three properties that exposure depends on, are on the Service itself at the
# bottom of this file — read them before changing any of the three.
#
# It still MUST NOT be merged into fastllm-proxy's LoadBalancer Service in
# deploy/service.yaml. Those are the *gateway's* addresses, held by callers
# with data-plane API keys and no business reaching the admin plane; one
# Service carrying both would put the admin port behind whatever gets opened
# up for the gateway next. Separate Services, separate addresses.
#
# See deploy/README.md, including "Bootstrapping the first admin login" for
# how to get a working session in the first place.
# CREDENTIALS ARE NOT IN THIS FILE, DELIBERATELY.
#
# fastllm-proxy-token and fastllm-encryption-key are created imperatively, the
# same way fastllm-proxy-auth is (see deploy/README.md). They used to ship here
# with REPLACE-ME placeholders and a comment saying to replace them and
# re-apply — which meant every later `kubectl apply -f deploy/` silently
# overwrote the real secrets with the placeholders and crash-looped the control
# plane. A manifest that destroys credentials when re-applied is worse than one
# that omits them.
#
#   kubectl -n fastllm create secret generic fastllm-proxy-token \
#     --from-literal=token="pt-$(openssl rand -hex 24)"
#   kubectl -n fastllm create secret generic fastllm-encryption-key \
#     --from-literal=key="$(openssl rand -hex 32)"
#
# Rotating fastllm-proxy-token needs both Deployments restarted. Rotating the
# encryption key is NOT just a restart: rows already encrypted under the old
# key must be re-encrypted first (`fastllm-proxy reencrypt-backends`).
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fastllm-pg
  namespace: fastllm
spec:
  # One instance, not the 3-instance HA pattern used elsewhere on kw
  # (novamail-pg): a control plane outage already degrades gracefully — the
  # proxy keeps serving from its last-known-good snapshot cache (see the
  # emptyDir mount in deployment.yaml) — so paying for synchronous replicas
  # here buys less than it costs. Revisit if that assumption stops holding.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  bootstrap:
    initdb:
      database: fastllm
      owner: fastllm
  # CNPG generates fastllm-pg-app with username/password/host/port/dbname
  # and a ready-made `uri` key — that `uri` is what fastllm-control's
  # FASTLLM_DATABASE_URL reads below, so there is no second place a DB
  # credential is copied to or can drift from what CNPG issued.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastllm-control
  namespace: fastllm
  labels: { app: fastllm-control }
spec:
  replicas: 1
  selector:
    matchLabels: { app: fastllm-control }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: fastllm-control }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: control
          # Pinned to a commit, never `:main` — but the pin is only true if it
          # is changed *here*. This said `sha-d3b569b` for weeks while the
          # cluster ran `sha-befa593`, because a roll-forward was done with
          # `kubectl set image` and the file was never updated. The next
          # `kubectl apply -f deploy/` silently downgraded the control plane by
          # one release, and it crash-looped on startup with
          #
          #     migration 14 was previously applied but is missing in the
          #     resolved migrations
          #
          # — sqlx refusing, correctly, to run against a schema newer than the
          # binary. It failed safe and the old pod kept serving, but the failure
          # mode of a stale image pin is a downgrade, not a no-op.
          image: 192.168.10.123/azrtydxb/fastllm-proxy/proxy:sha-18e0909
          imagePullPolicy: Always
          args:
            - --role=control
            - --admin-port=4001
            - --tls-cert=/etc/fastllm/tls/tls.crt
            - --tls-key=/etc/fastllm/tls/tls.key
          ports:
            - { name: admin, containerPort: 4001 }
          env:
            - name: FASTLLM_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: fastllm-pg-app, key: uri }
            - name: FASTLLM_PROXY_TOKEN
              valueFrom:
                secretKeyRef: { name: fastllm-proxy-token, key: token }
            - name: FASTLLM_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: fastllm-encryption-key, key: key }
            - name: FASTLLM_LOG
              value: info
          volumeMounts:
            # cert-manager-issued cert/key for `/snapshot` + `/usage`, from
            # the `Certificate` above. `readOnlyRootFilesystem` below means
            # this has to be an explicit volume, same reasoning as
            # deployment.yaml's snapshot-cache mount.
            - { name: tls, mountPath: /etc/fastllm/tls, readOnly: true }
          # `/admin/*` (POST/DELETE) is session-gated and mutating, not a
          # health check, so it's not a valid probe target. `/snapshot`
          # requires the proxy token, which the kubelet doesn't have, and
          # `/login` would mean handing the kubelet a real password just to
          # probe liveness. `GET /healthz` is the dedicated, unauthenticated
          # route for exactly this (see its doc comment in
          # src/control/api.rs): the kubelet has no session cookie and no
          # proxy token to present, so the probe target has to be a route
          # that needs neither — and it does no I/O (no database query) on
          # every hit, so a probe firing every few seconds does not become a
          # steady background query load, and a transient database blip does
          # not get an otherwise-healthy control plane restarted.
          #
          # `scheme: HTTPS` because the admin port only ever speaks TLS now
          # (`--tls-cert`/`--tls-key` above); this is not a downgrade from
          # the previous `tcpSocket` check's blindness to plaintext-vs-TLS.
          # The kubelet's `httpGet` probe does not verify the server
          # certificate (no `insecureSkipVerify` knob needed or offered —
          # that is simply how it behaves), so the in-cluster private CA on
          # `fastllm-control-tls` needs no special handling here.
          readinessProbe:
            httpGet: { path: /healthz, port: admin, scheme: HTTPS }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: admin, scheme: HTTPS }
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: admin, scheme: HTTPS }
            periodSeconds: 3
            failureThreshold: 20
          resources:
            # Sized for the classifier, which is what actually lives in this
            # process's memory: the fast-tier table plus, if any refined class
            # exists, an ONNX session. Measured at 272-275Mi with both loaded on
            # this cluster. The previous 256Mi limit OOM-killed the control
            # plane the moment a class was defined — a limit set before the
            # feature existed and never revisited.
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: tls
          secret: { secretName: fastllm-control-tls }
---
# The serving certificate for the admin port.
#
# This lived only in the cluster for its first three months — created by hand,
# described by deploy/README.md as being "in control.yaml", and absent from it.
# A manifest that cannot rebuild the deployment it claims to describe is the
# same failure as a stale comment, so it is here now.
#
# `ipAddresses` carries the VIP because the Service below is reached by address
# from outside the cluster, where `fastllm-control.fastllm.svc` does not
# resolve, and a certificate is only valid for the names it lists.
#
# This does NOT make a browser open the admin UI without a warning, and adding
# the SAN in the hope that it would is the mistake to avoid here: `cluster-ca`
# is a private CA in no OS trust store, so Chrome still reports
# ERR_CERT_AUTHORITY_INVALID on https://192.168.10.129:4001/. What the SAN buys
# is that the *only* remaining objection is the unknown authority — so
# `curl --cacert <ca.crt>` and any client given the cluster CA verify the
# connection fully, by IP, with no `-k` and no name override. Getting a
# warning-free browser means trusting `cluster-ca` on that machine; that is an
# operator's decision about their own laptop, not something a manifest does.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fastllm-control-tls
  namespace: fastllm
spec:
  secretName: fastllm-control-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef: { kind: ClusterIssuer, name: cluster-ca }
  dnsNames:
    - fastllm-control.fastllm.svc
    - fastllm-control.fastllm.svc.cluster.local
  ipAddresses:
    - 192.168.10.129
---
# The admin API, the management UI and `/snapshot`, on a pinned VIP.
#
# This was ClusterIP for most of the project's life, and the note at the top of
# this file argued for keeping it that way: a login form on a LAN-reachable
# address is a target, and `/snapshot` hands out decrypted upstream credentials
# to anything holding the proxy token.
#
# Both halves of that are still true. What changed is the weight given to the
# alternative, which was not "no exposure" but "every operator runs `kubectl
# port-forward` first" — and the practical effect of that was an admin plane
# nobody opened, on a LAN whose other services (the gateway itself, at .125 and
# .126, authenticated by the same key material) have always been reachable. The
# boundary being defended here was already crossed elsewhere.
#
# What the exposure actually rests on, and what must not be weakened:
#   - the listener is TLS-only (`--tls-cert`/`--tls-key` above), so neither a
#     session cookie nor the proxy token crosses the LAN in the clear;
#   - `/admin/*` and the UI need a session cookie, Argon2id-checked;
#   - `/snapshot` needs the proxy token and nothing else — so that token is the
#     one credential whose leak now costs more than it did, and rotating it
#     (`fastllm-proxy-token`, see the top of this file) is the response.
# If any of those three stops being true, this Service goes back to ClusterIP.
#
# Pinned by annotation rather than the deprecated `spec.loadBalancerIP`, and
# pinned *here* rather than on the live object — see deploy/service.yaml for
# what the two-sources-of-truth version of this cost.
apiVersion: v1
kind: Service
metadata:
  name: fastllm-control
  namespace: fastllm
  labels: { app: fastllm-control }
  annotations:
    kube-vip.io/loadbalancerIPs: "192.168.10.129"
spec:
  type: LoadBalancer
  selector: { app: fastllm-control }
  ports:
    - { name: admin, port: 4001, targetPort: admin }
