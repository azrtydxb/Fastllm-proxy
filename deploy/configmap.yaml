apiVersion: v1
kind: ConfigMap
metadata:
  name: fastllm-proxy-config
  namespace: fastllm
data:
  # fastllm-proxy runs `--role=proxy` against fastllm-control now (see
  # deployment.yaml and control.yaml), so `model_list` and
  # `general_settings.master_key` here would be dead weight — the control
  # plane's database is the source of truth for models, backends and keys.
  # Change those with the admin API (`POST /admin/keys`, and model/backend
  # rows directly — see deploy/README.md and `fastllm-proxy import`) not by
  # editing this file.
  #
  # This ConfigMap still exists for the one thing that survives the split:
  # the `fastllm:` tuning block, which every role reads from `--config` if
  # given one. Edit and re-apply to change it — the proxy hashes this file
  # every few seconds and reloads without a rollout or dropped generations.
  # Allow up to ~60s for the kubelet to refresh the mounted copy, then ~5s
  # for the poll.
  config.yaml: |
    fastllm:
      # One replica today, so affinity has nothing to choose between. These are
      # the defaults, written out so they are easy to tune when .246 returns
      # from ASUS and the pool goes back to two.
      prefix_bytes: 2048
      balance_abs: 8
      balance_rel: 1.5
      unhealthy_after: 2
