[workspace]
members = [".", "bench", "operator"]
# A plain `cargo build`/`cargo test` at the workspace root must build and test
# only the proxy: `bench` is measurement tooling and `operator` ships as its
# own image on its own release cycle, and both take real time to compile.
# `-p bench` / `-p fastllm-operator` still reach them explicitly.
default-members = ["."]

[package]
name = "fastllm-proxy"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Low-latency OpenAI-compatible inference gateway for multi-node LLM serving"
repository = "https://github.com/azrtydxb/Fastllm-proxy"
readme = "README.md"

[lib]
name = "fastllm_proxy"
path = "src/lib.rs"

[[bin]]
name = "fastllm-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "server", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# Not a TLS implementation itself — just PEM decoding into the
# `CertificateDer`/`PrivateKeyDer` types rustls's own `pki-types` crate
# defines, maintained by the same project. Unconditional (not behind
# `control`): the data-plane client needs it too, to load an extra CA bundle
# for a private control-plane or backend cert (`tls_config` in main.rs), in
# every build including `--no-default-features`.
rustls-pemfile = "2"
http-body-util = "0.1"
http = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
arc-swap = "1"
parking_lot = "0.12"
pin-project-lite = "0.2"
smallvec = "1"
sha2 = "0.10"
humantime = "2"
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "chrono", "uuid"] }
axum = { version = "0.8", optional = true }
argon2 = { version = "0.5", optional = true }
# Unconditional: the wire snapshot format (src/snapshot.rs) is the contract
# between the control plane and the data plane, and the data plane (HttpSource,
# src/source/http.rs) needs it even in a --no-default-features build that has
# no database driver at all.
chrono = { version = "0.4", features = ["serde"] }
# Identifiers. `serde` so an id crosses the API as a string rather than a byte
# array, and `v4` because a random id is the point -- a v7 would carry the
# creation time of the row it names.
uuid = { version = "1", features = ["serde", "v4", "v5"] }
hex = "0.4"
rand = { version = "0.9", optional = true }
# Already pulled in transitively by rustls/tokio-rustls (see the `ring`
# features on those two above) — this promotes it to a direct dependency so
# `src/control/secrets.rs` can call `ring::aead` for encryption at rest,
# without adding a new crate to the dependency tree.
ring = { version = "0.17", optional = true }
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
# Embeds the management UI's built `web/dist/` into the binary (P4). Points
# at a directory that may not exist yet in a plain `cargo build` — see
# `src/control/ui.rs` for how a missing/empty `web/dist/` degrades to "UI not
# available" instead of failing the build. `default-features = false`: the
# default `debug-embed`-adjacent watch/compression machinery is irrelevant
# here, `mime-guess` is what lets served files carry a real `Content-Type`,
# and `axum` gives `Cow<[u8]>`/embedded-file conversions this crate's own
# axum handlers use directly instead of hand-rolling them.
rust-embed = { version = "8", default-features = false, features = ["mime-guess", "axum"], optional = true }
model2vec-rs = { version = "0.2", optional = true }
# Tier 2 only. Brings ONNX Runtime, which is why it is a separate feature from
# `classifier` rather than part of it: a deployment that routes on subject
# alone (most of them) should not carry a native inference runtime.
fastembed = { version = "5", optional = true }

[features]
default = ["control"]
control = ["dep:sqlx", "dep:axum", "dep:argon2", "dep:rand", "dep:ring", "dep:rust-embed"]
classifier = ["dep:model2vec-rs"]
classifier-tier2 = ["classifier", "dep:fastembed"]
# OTLP tracing. Behind a feature because it is the only telemetry here that
# adds a dependency tree (opentelemetry + tonic/gRPC) and the only one that
# needs something deployed to receive it; a build without it carries none of
# that and pays nothing at runtime.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", features = ["json"] }
# Unconditional (not gated on the `control` feature): `tests/virtual_models.rs`
# reaches into Postgres directly to set up a fine-grained RBAC fixture no
# admin route grants (see that file's doc comment). Dev-dependencies are
# never compiled by a plain `cargo build`, so this does not affect the
# `--no-default-features` library/binary build.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
