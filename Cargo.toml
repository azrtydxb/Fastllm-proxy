[workspace]
members = [".", "bench"]
# A plain `cargo build`/`cargo test` at the workspace root must build and test
# only the proxy: `bench` is measurement tooling, not part of the product, and
# its binaries take real time to compile. `-p bench` (or a `cd bench`) still
# reaches it explicitly.
default-members = ["."]

[package]
name = "fastllm-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Low-latency OpenAI-compatible inference gateway for multi-node LLM serving"
repository = "https://github.com/azrtydxb/Fastllm-proxy"
readme = "README.md"

[lib]
name = "fastllm_proxy"
path = "src/lib.rs"

[[bin]]
name = "fastllm-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "server", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# Not a TLS implementation itself — just PEM decoding into the
# `CertificateDer`/`PrivateKeyDer` types rustls's own `pki-types` crate
# defines, maintained by the same project. Unconditional (not behind
# `control`): the data-plane client needs it too, to load an extra CA bundle
# for a private control-plane or backend cert (`tls_config` in main.rs), in
# every build including `--no-default-features`.
rustls-pemfile = "2"
http-body-util = "0.1"
http = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
arc-swap = "1"
parking_lot = "0.12"
pin-project-lite = "0.2"
smallvec = "1"
sha2 = "0.10"
humantime = "2"
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "chrono"] }
axum = { version = "0.8", optional = true }
argon2 = { version = "0.5", optional = true }
# Unconditional: the wire snapshot format (src/snapshot.rs) is the contract
# between the control plane and the data plane, and the data plane (HttpSource,
# src/source/http.rs) needs it even in a --no-default-features build that has
# no database driver at all.
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rand = { version = "0.9", optional = true }
# Already pulled in transitively by rustls/tokio-rustls (see the `ring`
# features on those two above) — this promotes it to a direct dependency so
# `src/control/secrets.rs` can call `ring::aead` for encryption at rest,
# without adding a new crate to the dependency tree.
ring = { version = "0.17", optional = true }

[features]
default = ["control"]
control = ["dep:sqlx", "dep:axum", "dep:argon2", "dep:rand", "dep:ring"]

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
