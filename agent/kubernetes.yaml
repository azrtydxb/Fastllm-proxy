# The node agent, running inside a Kubernetes cluster.
#
# Same agent as the systemd unit beside this file, with `--kubernetes`: it asks
# the API which addresses the cluster exposes instead of probing a list of
# ports. A cluster knows exactly what is reachable from outside it, and
# guessing at ports when something can tell you is how an engine on a port
# nobody thought of stays invisible.
#
# *Exposed* is the whole criterion, which is why there is no label to apply and
# no annotation to remember. A NodePort, a LoadBalancer and a hostPort are
# reachable from outside the cluster by definition; a ClusterIP is not, and so
# is never a candidate. Whether a candidate is a *model* is then settled the
# same way it is for every other source — by asking it for `/v1/models`. A
# cluster that exposes Postgres and an ingress and no engines registers
# nothing.
#
# This is deliberately a Deployment and not a DaemonSet. The agent reads the
# API and registers addresses that are cluster-wide; one copy answers for the
# whole cluster, and one per node would have every node re-register the same
# LoadBalancer.
#
# It dials out and is never dialled, so the cluster it runs in needs no inbound
# path from FastLLM. That is what lets it serve a cluster the proxies live
# outside of; on kw, where they share one, it costs nothing either way.
#
# The secrets it reads, and how to make them, are in
# docs/operations/registering-hosts.md.
---
apiVersion: v1
kind: Namespace
metadata:
  name: fastllm-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastllm-node-agent
  namespace: fastllm-agent
---
# Read-only, and only the two kinds it reads. It never writes to this cluster:
# everything it learns goes out to FastLLM over the token below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fastllm-node-agent
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fastllm-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fastllm-node-agent
subjects:
  - kind: ServiceAccount
    name: fastllm-node-agent
    namespace: fastllm-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastllm-node-agent
  namespace: fastllm-agent
spec:
  # One. See the header: the agent speaks for the cluster, not for a node.
  replicas: 1
  selector:
    matchLabels:
      app: fastllm-node-agent
  template:
    metadata:
      labels:
        app: fastllm-node-agent
    spec:
      serviceAccountName: fastllm-node-agent
      containers:
        - name: agent
          # The release build ships this image (agent/Dockerfile): python plus
          # the script, entrypoint baked in. Pinned to the release rather than
          # `latest`, so what runs is what was tested, and it moves with each
          # release (tests/release_consistency.rs holds it there).
          image: ghcr.io/azrtydxb/fastllm-node-agent:v0.3.3
          # `args`, not `command`: `command` replaces the image's entrypoint,
          # and the container would try to execute `--kubernetes` itself.
          args: ["--kubernetes"]
          env:
            # The control plane runs in this same cluster, so it is reached
            # by its service name — which is on its certificate.
            - name: FASTLLM_CONTROL_URL
              value: https://fastllm-control.fastllm.svc:4001
            - name: FASTLLM_NODE
              value: kw
            # No FASTLLM_ADVERTISE: a host-network pod is addressed by its own
            # node's InternalIP from the Nodes API, which is how the engines on
            # the gx10 nodes register under the addresses the proxies dial. Set
            # it only for a cluster whose nodes are reached some other way, or
            # to register NodePorts.
            - name: FASTLLM_CA_CERT
              value: /etc/fastllm/ca.crt
            - name: FASTLLM_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fastllm-agent-token
                  key: token
          volumeMounts:
            - { name: ca, mountPath: /etc/fastllm, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: { drop: ["ALL"] }
      volumes:
        # The control plane's certificate comes from an internal CA no public
        # root store has heard of. There is deliberately no way to skip
        # verification: the token above travels over this connection, and an
        # agent that stops checking hands it to whoever answers.
        - name: ca
          secret:
            secretName: fastllm-control-ca
