{{- if not .Values.secrets.existingSecret }}
{{- /*
  Generated once and preserved across upgrades by looking up what is already
  there. Regenerating the encryption key on every `helm upgrade` would make
  every stored upstream credential undecryptable — the rows stay, and nothing
  can read them. `lookup` returns nothing on a dry run or a fresh install,
  which is exactly when generating is correct.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "fastllm.fullname" .))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fastllm.fullname" . }}-secrets
  labels: {{- include "fastllm.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.secrets.proxyTokenKey }}: {{ if $existing }}{{ index $existing.data .Values.secrets.proxyTokenKey }}{{ else }}{{ printf "pt-%s" (randAlphaNum 32) | b64enc }}{{ end }}
  {{ .Values.secrets.encryptionKeyKey }}: {{ if $existing }}{{ index $existing.data .Values.secrets.encryptionKeyKey }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}
