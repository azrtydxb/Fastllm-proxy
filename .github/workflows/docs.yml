# Publish the docs to GitHub Pages.
#
# The book is built from `docs/` directly rather than from a copy, so the
# published site and the repo cannot disagree — the failure mode this whole
# project keeps guarding against.
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "book.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install mdbook-mermaid
        run: |
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.15.0/mdbook-mermaid-v0.15.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          # Writes mermaid.min.js and mermaid-init.js next to book.toml, which
          # `additional-js` then references. Without them the page loads and the
          # diagrams silently do not render.
          mdbook-mermaid install .
      - run: mdbook build
      # The interactive reference (docs/api/swagger.md) fetches this at the
      # site root. Copied rather than duplicated into `docs/`, so there stays
      # exactly one openapi.json and `tests/openapi.rs` keeps checking the one
      # the binary actually serves.
      - name: Publish openapi.json alongside the book
        run: cp openapi.json book/openapi.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
