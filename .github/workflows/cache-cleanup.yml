name: cache-cleanup

# Deleting a branch deletes its build caches (buildx layers) on Kuvryn Ant.
# Runs from the default branch's copy of this file; needs no secret.
on:
  delete:

permissions:
  id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)

jobs:
  cleanup:
    if: github.event.ref_type == 'branch'
    runs-on: arc-azrtydxb
    timeout-minutes: 10
    steps:
      - uses: azrtydxb/ant-setup-action/cache-cleanup@v1
