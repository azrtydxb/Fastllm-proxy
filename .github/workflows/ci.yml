name: CI

# Three-tier test model (azrtydxb CI standard §Test tiers):
#   unit        = pull_request (fmt/clippy + hermetic unit subset) and main
#   integration = nightly cron + manual (service-backed / Postgres + classifier tests)
#   full        = v* release tags (all features, ignored tests, coverage)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      integration:
        description: "Run the service-backed integration tier (Postgres, classifier). Always on when dispatched on main."
        type: boolean
        default: false

# A newer push supersedes an older run of the same ref — but only for PRs and
# manual runs on a feature branch. On main and tags every commit publishes an
# image, so those runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}

env:
  # Pushes go to the authoritative Kuvryn Ant (OKE) with a GitHub OIDC docker
  # login (no stored secret). kw replicates oci-hosted, and its nodes serve the
  # old 192.168.10.131[:5000]/azrtydxb/... names from that replica.
  REGISTRY: ant.azrty.com/oci-hosted
  IMAGE: ant.azrty.com/oci-hosted/azrtydxb/fastllm-proxy/proxy

permissions: write-all

jobs:
  test:
    runs-on: arc-azrtydxb
    timeout-minutes: 120
    # The runner image ships no Rust, so the toolchain comes from a container —
    # same base as the Dockerfile, so CI and the image agree on the compiler.
    # trixie specifically: the prebuilt onnxruntime that `ort-sys` fetches for the
    # `--all-features` release-tag build needs glibc >= 2.38 and libstdc++ 14
    # (`__isoc23_strtol`, `__cxa_call_terminate`); bookworm fails to link it on
    # aarch64, and that step runs only on tags, so it surfaced as a failed release.
    container:
      image: rust:1-trixie
    env:
      # Kept in the workspace so the cargo config written below lands somewhere
      # predictable and writable. It is no longer cached — dependency sources
      # come from the Nexus cargo proxy and compiled artifacts from sccache,
      # both on the LAN. The `cargo` binary itself stays on PATH from the image.
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      # Cargo's default is 3 retries. The Nexus mirror has gone away mid-build
      # before; more retries ride out a restart that the reachability probe in
      # `Point cargo at the local proxy` happened to miss.
      CARGO_NET_RETRY: "10"
      # sccache comes from azrtydxb/ant-setup-action (build-cache: true): it installs
      # the binary, sets RUSTC_WRAPPER and points SCCACHE_WEBDAV_* at the Kuvryn Ant
      # sccache feed with the job's short-lived OIDC token.
      SECRET_LEN_TEST: ${{ secrets.SECRET_LEN_TEST }}
    # Same Postgres major version the shared cluster runs in production
    # (deploy/control.yaml points at it via `fastllm-db-shared`). Where it is
    # reachable depends on the runner mode: on the ARC kubernetes runners it is
    # a sidecar in the job pod, on localhost; on dind it is a sibling
    # container, reached by its service name. `Wait for Postgres` finds out
    # which and exports PG_HOST. Service options are ignored on the kubernetes
    # runners, so readiness is that step's job rather than a health check.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fastllm
          POSTGRES_PASSWORD: fastllm
          POSTGRES_DB: fastllm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ant
        uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
        with:
          build-cache: "true"
          sccache: "true"
      # Nothing in this job round-trips to GitHub any more: dependency sources
      # come from the Nexus cargo proxy and compiled artifacts from sccache,
      # both on the LAN. Both need to trust the cluster CA.
      #
      # It goes into the system trust store rather than per-tool env vars,
      # because those only cover tools that read them: sccache is a Rust binary
      # whose TLS backend may ignore SSL_CERT_FILE, and it fails soft — a trust
      # error there would silently disable caching instead of failing the build.
      #
      # The CA is pinned in-repo (.github/ca/cluster-ca.crt), so this needs no
      # network. Crates come from Kuvryn Ant (azrtydxb/ant-setup-action, which
      # replaces crates.io with the Ant sparse feed via GitHub OIDC).
      - name: Trust the cluster CA
        id: ca
        run: |
          set -u
          CA_DEST=/usr/local/share/ca-certificates/cluster-ca.crt
          PINNED="$GITHUB_WORKSPACE/.github/ca/cluster-ca.crt"

          trust() {
            install -m644 "$1" "$CA_DEST"
            update-ca-certificates >/dev/null
            echo "CARGO_HTTP_CAINFO=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
          }

          if [ -s "$PINNED" ] && grep -q 'BEGIN CERTIFICATE' "$PINNED"; then
            echo "Trusting the pinned cluster CA at $PINNED"
            trust "$PINNED"
            echo "status=pinned" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::pinned cluster CA missing at $PINNED; continuing without it."
          echo "status=missing" >> "$GITHUB_OUTPUT"
      # sccache instead of actions/cache: the problem with actions/cache here was
      # that the cache is remote at all (a miss still paid a 417s upload to GitHub).
      # The sccache feed on Kuvryn Ant is on OKE and the compiled units are small, so
      # hits are cheap. ant-setup-action (above) installs and configures sccache; it
      # fails soft, so the stats step at the end is what shows whether it works.
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      # The Claude skills in .claude/skills carry a generated endpoint table
      # derived from openapi.json and the axum route table. Regenerating here
      # rather than trusting it: a skill that has quietly stopped matching the
      # API is worse than no skill, and this also fails when a newly added
      # endpoint belongs to no skill at all.
      - name: Skills up to date
        # rust:1-bookworm ships no python3, so install it rather than let the
        # step fail for a reason unrelated to what it checks.
        run: |
          command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3; }
          python3 scripts/gen-claude-skills.py --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      # `default-members = ["."]`, so everything above tests the proxy and
      # nothing else. The operator ships as its own image and had never been
      # linted or tested here: a PodDisruptionBudget selecting zero pods
      # reached a live cluster and sat there for two weeks, and the committed
      # CRD drifted from its own generator without a single red build.
      - name: Clippy (operator)
        run: cargo clippy -p fastllm-operator --all-targets -- -D warnings
      - name: Test (operator)
        run: cargo test -p fastllm-operator --locked
      # Only the tiers that run database tests wait; a PR never touches Postgres.
      - name: Wait for Postgres
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.integration)) || startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 3
        shell: bash
        run: |
          # The rust image has no pg_isready. The postgres image only listens on
          # TCP once its init is done, so an accepted connection means ready.
          while :; do
            for host in localhost postgres; do
              if timeout 3 bash -c "</dev/tcp/$host/5432" 2>/dev/null; then
                echo "Postgres is up on $host"
                echo "PG_HOST=$host" >> "$GITHUB_ENV"
                exit 0
              fi
            done
            sleep 2
          done
      # The database tests are `#[ignore]`d by default so `cargo test` stays
      # database-free everywhere else (a laptop with no Postgres running,
      # `cargo build --no-default-features`). Here, with a real Postgres
      # alongside, `--include-ignored` actually runs them.
      - name: Test (with database)
        # Service-backed (Postgres) integration tier: nightly/manual only, never on PR.
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.integration)) }}
        env:
          DATABASE_URL: postgres://fastllm:fastllm@${{ env.PG_HOST }}:5432/fastllm
          # Every process that talks to Postgres takes a whole *pool*, not a
          # connection. `cargo test` runs each test binary's tests in parallel
          # and several binaries at once, and each spawned proxy plus each
          # library test's own pool counts — which at the default of 8 adds up
          # past this Postgres's 100 and presents as an unrelated test failing
          # to connect. The end-to-end tests already pin this per spawned
          # process; this covers the library tests' own pools too.
          FASTLLM_DATABASE_MAX_CONNECTIONS: "2"
        run: cargo test --features control --locked -- --include-ignored
      # Semantic routing is behind a feature, so the run above never compiles
      # it — and a test that needs it is `#[cfg]`d out rather than failing for
      # the wrong reason. This run is what actually exercises it.
      #
      # The classifier model comes from HuggingFace on first use. The ARC
      # runners are ephemeral pods, so "cached by the runner" lasts exactly
      # one pod — without this cache every fresh pod re-downloads the model
      # inside the semantic-routing test's health window and the test dies
      # waiting. HF_HOME pins the cache somewhere actions/cache can see.
      - name: Cache the classifier model
        # Integration (nightly/manual) and full (release tag) tiers only; never on PR.
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.integration)) || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf-cache
          key: hf-potion-code-16m
      # Fetch it here rather than letting the test pay for it.
      #
      # `actions/cache` only restores; on a miss the download happened inside
      # the semantic-routing test's health window, and the test died waiting
      # with nothing to say but that it had waited. Doing it in its own step
      # makes a cold cache a slow *step* with its own log instead of a
      # five-minute test failure that looks like a flake. A warm cache makes
      # this a no-op.
      - name: Fetch the classifier model
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.integration)) || startsWith(github.ref, 'refs/tags/v') }}
        env:
          HF_HOME: ${{ github.workspace }}/.hf-cache
        run: |
          # Guard on pip, not python3. The rust image ships python3 without
          # it, so a `command -v python3` check passed and the install never
          # ran — `No module named pip`, which is what this step failed with
          # the first time.
          python3 -m pip --version >/dev/null 2>&1 \
            || { apt-get update -qq && apt-get install -y -qq python3-pip; }
          python3 -m pip install --quiet --break-system-packages huggingface_hub 2>/dev/null \
            || python3 -m pip install --quiet huggingface_hub
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          # Same repo id the test passes as --classifier-model.
          p = snapshot_download("minishlab/potion-code-16M")
          print(f"classifier model ready at {p}")
          PY
      - name: Clippy (classifier)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.integration)) }}
        run: cargo clippy --all-targets --features "control classifier-tier2" -- -D warnings
      - name: Test (classifier)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.integration)) }}
        env:
          DATABASE_URL: postgres://fastllm:fastllm@${{ env.PG_HOST }}:5432/fastllm
          FASTLLM_DATABASE_MAX_CONNECTIONS: "2"
          HF_HOME: ${{ github.workspace }}/.hf-cache
        run: cargo test --features "control classifier" --locked -- --include-ignored
      # Full tier (v* release tags): the whole feature matrix including the
      # `#[ignore]`d service-backed tests, under coverage instrumentation.
      # The test run is the gate; coverage reporting is best-effort.
      # Prebuilt binary instead of compiling cargo-llvm-cov from source every
      # tag. Best-effort as before: without it the suite runs, uncovered.
      - name: Install cargo-llvm-cov (release tags)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - name: Full suite + coverage (release tags)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          DATABASE_URL: postgres://fastllm:fastllm@${{ env.PG_HOST }}:5432/fastllm
          FASTLLM_DATABASE_MAX_CONNECTIONS: "2"
          HF_HOME: ${{ github.workspace }}/.hf-cache
        run: |
          rustup component add llvm-tools-preview
          if command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo llvm-cov --all-features --locked --lcov --output-path lcov.info -- --include-ignored
          else
            echo "::warning::cargo-llvm-cov unavailable; running the full suite without a coverage report"
            cargo test --all-features --locked -- --include-ignored
          fi
      - name: Upload coverage (release tags)
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: ignore
      # Prints hits and misses; without this the cache is invisible and there is no way
      # to tell whether it is earning its keep.
      - name: sccache stats
        if: always()
        uses: azrtydxb/ant-setup-action/cache-stats@37005b6568d80864a713c00ceafef6cda19fcde4 # v1

  # A separate job with its own container, so the Rust job stays Node-free —
  # the same reason the Dockerfile builds the UI in a dedicated stage rather
  # than shelling out to npm from a build.rs.
  ui:
    runs-on: arc-azrtydxb
    timeout-minutes: 15
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
      # npm resolves through Kuvryn Ant (azrtydxb/ant-setup-action below).
      - name: Install
        working-directory: web
        run: npm install
      # Two harnesses. `render` mounts every screen against stubbed responses
      # shaped like the ones `control::api` serialises; `interact` clicks every
      # control and asserts the method, path and body each one sends. The
      # second exists because the worst bug this UI has had was a correct-
      # looking screen posting a body serde silently discarded — nothing
      # rendered wrong, and no test had ever looked at a request body.
      - name: Screen and interaction checks
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build

  publish:
    # Only main becomes a Ant image. A branch dispatch or PR is tested and
    # nothing more; a tag is published by the release-* jobs, and its sha- tag
    # already exists from the main build (immutable in Ant, so rebuilding it
    # fails with "immutable content conflicts" and turned every tag run red).
    if: github.ref == 'refs/heads/main'
    needs: [test, ui]
    runs-on: arc-azrtydxb
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1

      # Every build gets an immutable sha- tag. The moving `main` tag and a
      # semver tag are only added when the ref actually warrants them, so a
      # workflow_dispatch on a branch cannot quietly redefine what `:main` is.
      - name: Compute tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            [ "${GITHUB_REF_TYPE}" = "tag" ] && echo "${IMAGE}:${GITHUB_REF_NAME#v}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # The operator image is tagged from the same commit, so it needs the
          # short sha as its own output rather than parsed back out of `tags`.
          echo "short=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.IMAGE }}

      # The runner pod's own rootless BuildKit sidecar, for the runner's
      # platform (linux/arm64). Its buildkitd.toml (azrty-infra, ConfigMap
      # arc-k8s-config) already pulls Docker Hub through the Kuvryn Ant mirror and
      # trusts the home Nexus CA, so nothing needs configuring here. BuildKit is
      # current there, so a cache-from ref that does not exist yet is a warning,
      # not the fatal "failed to configure registry cache importer" an old
      # builder gave.
      - name: Set up the BuildKit sidecar builder
        id: builder
        uses: azrtydxb/.github/actions/setup-builder@a6fb8e66bd50b411a1f20b826567ef320aec469b # main

      # GHCR as well as the private registry, but only for a tagged release.
      # Every commit to main pushes to zot because this cluster deploys from
      # it continuously; publishing every commit publicly would make "latest"
      # mean "whatever landed most recently", which is the drift that already
      # cost this project a downgraded control plane.

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Public tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: public
        run: |
          v="${GITHUB_REF#refs/tags/}"
          echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}:${v},ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      # build-push-action v7, not v6. v6 treats a cache-from ref that does not
      # exist as fatal — "failed to configure registry cache importer: ...
      # not found" — which blocked every publish once the old Zot buildcache
      # went away. v7 tolerates it, which is what novamem does against an
      # identically missing cache.
      - name: Log in to Kuvryn Ant (GitHub OIDC)
        uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
        with:
          docker-login: "true"
          required: "true"
          go: "false"
          cargo: "false"
          pip: "false"

      # sha- tags are immutable in Ant, and a rebuild of the same commit is not
      # byte-identical, so the nightly schedule (or a re-run) pushing a sha that
      # is already published was refused with "immutable content conflicts".
      # Skip the images that already exist for this commit.
      - name: Already published?
        id: published
        if: github.ref_type != 'tag'
        env:
          SHORT: ${{ steps.meta.outputs.short }}
          PROXY: ${{ env.IMAGE }}
          OPERATOR: ${{ env.REGISTRY }}/azrtydxb/fastllm-proxy/operator
        run: |
          for pair in "proxy=$PROXY" "operator=$OPERATOR"; do
            ref="${pair#*=}:$SHORT"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "${pair%%=*}=true" >> "$GITHUB_OUTPUT"
              echo "$ref is already published; not rebuilding it"
            fi
          done

      - id: ant-cache-1
        uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
        with:
          build-cache: "true"
          cache-name: proxy
          arch-suffix: arm64
          sccache: "false"
          go: "false"
          npm: "false"
          cargo: "false"
          pip: "false"
      - name: Build & push (arm64 → Kuvryn Ant)
        if: steps.published.outputs.proxy != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.builder.outputs.name }}
          context: .
          # arm64 only: every node in kw is arm64, and a Rust release build
          # under QEMU is not worth the wall clock.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: ${{ steps.ant-cache-1.outputs.cache-from }}
          cache-to: ${{ steps.ant-cache-1.outputs.cache-to }}

      - id: ant-cache-2
        uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
        with:
          build-cache: "true"
          cache-name: operator
          arch-suffix: arm64
          sccache: "false"
          go: "false"
          npm: "false"
          cargo: "false"
          pip: "false"
      # The operator is a second image on the same release cycle. Small and
      # fast to build — no UI stage, no classifier models — so it rides along
      # rather than getting its own workflow.
      - name: Build & push the operator (arm64 → Kuvryn Ant)
        if: steps.published.outputs.operator != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.builder.outputs.name }}
          context: .
          file: operator/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/azrtydxb/fastllm-proxy/operator:${{ steps.meta.outputs.short }}
          cache-from: ${{ steps.ant-cache-2.outputs.cache-from }}
          cache-to: ${{ steps.ant-cache-2.outputs.cache-to }}

  # ---------------------------------------------------------------- release
  #
  # A tag builds each architecture on a runner that *is* that architecture and
  # merges the two digests into one manifest. The previous attempt emulated
  # amd64 with QEMU and rustc segfaulted before compiling anything — there is
  # an amd64 runner, so there was never a reason to emulate.
  #
  # Split into three jobs rather than one `platforms: linux/amd64,linux/arm64`
  # because the two legs run on different machines; `push-by-digest` is what
  # lets them be assembled afterwards.

  release-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, ui]
    runs-on: arc-azrtydxb
    timeout-minutes: 60
    permissions: { contents: read, packages: write, id-token: write }
    outputs:
      proxy: ${{ steps.proxy.outputs.digest }}
      operator: ${{ steps.operator.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The runner pod's own BuildKit sidecar (linux/arm64).
      - name: Local arm64 builder
        id: builder
        uses: azrtydxb/.github/actions/setup-builder@a6fb8e66bd50b411a1f20b826567ef320aec469b # main
      - name: Proxy (arm64, digest only)
        id: proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          builder: ${{ steps.builder.outputs.name }}
          platforms: linux/arm64
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/fastllm-proxy",push-by-digest=true,name-canonical=true,push=true
      - name: Operator (arm64, digest only)
        id: operator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: operator/Dockerfile
          builder: ${{ steps.builder.outputs.name }}
          platforms: linux/arm64
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/fastllm-operator",push-by-digest=true,name-canonical=true,push=true

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
      # The node agent is standard library only, and so are its tests.
      - name: Node agent tests
        run: python3 -m unittest discover -s agent -v

  # The node agent, one architecture per runner on that runner's BuildKit
  # sidecar, pushed by digest; release-agent-manifest joins the two under the
  # release tags. One multi-platform build would need a builder node for the
  # other architecture.
  release-agent:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, ui, agent]
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: arc-azrtydxb
          - arch: amd64
            runner: arc-azrtydxb-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: builder
        uses: azrtydxb/.github/actions/setup-builder@a6fb8e66bd50b411a1f20b826567ef320aec469b # main
      - name: Node agent (${{ matrix.arch }}, digest only)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: agent/Dockerfile
          builder: ${{ steps.builder.outputs.name }}
          platforms: linux/${{ matrix.arch }}
          # As before the split: the image was built on the docker driver, which
          # attaches no provenance attestation.
          provenance: false
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/fastllm-node-agent",push-by-digest=true,name-canonical=true,push=true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "no digest from the build" >&2; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/agent-digest"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/agent-digest/${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/agent-digest/
          if-no-files-found: error
          retention-days: 1

  release-agent-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-agent]
    runs-on: arc-azrtydxb
    timeout-minutes: 15
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/agent-digest
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and verify the node agent manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fastllm-node-agent
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/agent-digest"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" \
            "${IMAGE}@$(cat "$dir/arm64")" "${IMAGE}@$(cat "$dir/amd64")"
          archs=$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" \
                  | grep -o '"architecture": *"[a-z0-9]*"' | sort -u)
          echo "$archs"
          echo "$archs" | grep -q 'arm64'
          echo "$archs" | grep -q 'amd64'

  release-amd64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, ui]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 60
    permissions: { contents: read, packages: write, id-token: write }
    outputs:
      proxy: ${{ steps.proxy.outputs.digest }}
      operator: ${{ steps.operator.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@37005b6568d80864a713c00ceafef6cda19fcde4 # v1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built natively on the runner pod's own BuildKit sidecar: this runner is
      # amd64 itself, so there is nothing to reach out to.
      - name: Local amd64 builder
        id: builder
        uses: azrtydxb/.github/actions/setup-builder@a6fb8e66bd50b411a1f20b826567ef320aec469b # main
      - name: Proxy (amd64, digest only)
        id: proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          builder: ${{ steps.builder.outputs.name }}
          platforms: linux/amd64
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/fastllm-proxy",push-by-digest=true,name-canonical=true,push=true
      - name: Operator (amd64, digest only)
        id: operator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: operator/Dockerfile
          builder: ${{ steps.builder.outputs.name }}
          platforms: linux/amd64
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/fastllm-operator",push-by-digest=true,name-canonical=true,push=true

  release-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-arm64, release-amd64]
    runs-on: arc-azrtydxb
    timeout-minutes: 15
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and verify both manifests
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assemble() {
            local image="ghcr.io/${OWNER}/$1" arm="$2" amd="$3"
            docker buildx imagetools create \
              -t "${image}:${VERSION}" -t "${image}:latest" \
              "${image}@${arm}" "${image}@${amd}"
            # Both architectures, asserted rather than assumed: a manifest that
            # claims an architecture it does not carry is worse than one that
            # never claimed it.
            local archs
            archs=$(docker buildx imagetools inspect --raw "${image}:${VERSION}" \
                    | grep -o '"architecture": *"[a-z0-9]*"' | sort -u)
            echo "$archs"
            echo "$archs" | grep -q 'arm64'
            echo "$archs" | grep -q 'amd64'
          }
          assemble fastllm-proxy "${{ needs.release-arm64.outputs.proxy }}" "${{ needs.release-amd64.outputs.proxy }}"
          assemble fastllm-operator "${{ needs.release-arm64.outputs.operator }}" "${{ needs.release-amd64.outputs.operator }}"
