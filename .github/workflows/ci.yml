name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: 192.168.10.123:5000
  IMAGE: 192.168.10.123:5000/azrtydxb/fastllm-proxy/proxy

jobs:
  test:
    runs-on: arc-azrtydxb
    # The runner image ships no Rust, so the toolchain comes from a container —
    # same base as the Dockerfile, so CI and the image agree on the compiler.
    container:
      image: rust:1-bookworm
    # A sibling service container, reachable by its service name — not
    # localhost, which is the `test` container's own loopback, not the
    # runner's. Same Postgres major version CNPG runs in deploy/control.yaml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fastllm
          POSTGRES_PASSWORD: fastllm
          POSTGRES_DB: fastllm
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      # The database tests are `#[ignore]`d by default so `cargo test` stays
      # database-free everywhere else (a laptop with no Postgres running,
      # `cargo build --no-default-features`). Here, with a real Postgres
      # alongside, `--include-ignored` actually runs them.
      - name: Test (with database)
        env:
          DATABASE_URL: postgres://fastllm:fastllm@postgres:5432/fastllm
          # Every process that talks to Postgres takes a whole *pool*, not a
          # connection. `cargo test` runs each test binary's tests in parallel
          # and several binaries at once, and each spawned proxy plus each
          # library test's own pool counts — which at the default of 8 adds up
          # past this Postgres's 100 and presents as an unrelated test failing
          # to connect. The end-to-end tests already pin this per spawned
          # process; this covers the library tests' own pools too.
          FASTLLM_DATABASE_MAX_CONNECTIONS: "2"
        run: cargo test --features control --locked -- --include-ignored
      # Semantic routing is behind a feature, so the run above never compiles
      # it — and a test that needs it is `#[cfg]`d out rather than failing for
      # the wrong reason. This run is what actually exercises it. The model is
      # fetched from HuggingFace on first use and cached by the runner.
      - name: Clippy (classifier)
        run: cargo clippy --all-targets --features "control classifier-tier2" -- -D warnings
      - name: Test (classifier)
        env:
          DATABASE_URL: postgres://fastllm:fastllm@postgres:5432/fastllm
          FASTLLM_DATABASE_MAX_CONNECTIONS: "2"
        run: cargo test --features "control classifier" --locked -- --include-ignored

  publish:
    # Only what lands on main or a tag becomes an image; a PR just gets tested.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: arc-azrtydxb-publish
    steps:
      - uses: actions/checkout@v4

      # Every build gets an immutable sha- tag. The moving `main` tag and a
      # semver tag are only added when the ref actually warrants them, so a
      # workflow_dispatch on a branch cannot quietly redefine what `:main` is.
      - name: Compute tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            [ "${GITHUB_REF}" = "refs/heads/main" ] && echo "${IMAGE}:main"
            [ "${GITHUB_REF_TYPE}" = "tag" ] && echo "${IMAGE}:${GITHUB_REF_NAME#v}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.IMAGE }}

      - name: Set up buildx (zot insecure, Docker Hub via cluster mirror)
        run: |
          cat > /tmp/buildkitd.toml <<'EOF'
          [registry."192.168.10.123:5000"]
            insecure = true
          # Pull base images through the cluster's Zot pull-through cache rather
          # than hitting Docker Hub anonymously and collecting 429s.
          [registry."docker.io"]
            mirrors = ["192.168.10.123:5000"]
          EOF
          docker buildx create --name fastllm --driver docker-container \
            --platform linux/arm64 --buildkitd-config /tmp/buildkitd.toml --use
          docker buildx inspect --bootstrap

      - name: Build & push (arm64 → zot)
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: fastllm
          # arm64 only: every node in kw is arm64, and a Rust release build
          # under QEMU is not worth the wall clock.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/fastllm-proxy:arm64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/buildcache/fastllm-proxy:arm64,mode=max,image-manifest=true
