name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an older run of the same ref — but only for PRs.
# On main and tags every commit publishes an image, so those runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nexus replaced Zot. Push goes to :5000 (the hosted repo's own connector,
  # because deploying to a Nexus group needs a PRO-licensed writable member);
  # deployments pull the same image from 443 with no port suffix.
  REGISTRY: 192.168.10.131:5000
  IMAGE: 192.168.10.131:5000/azrtydxb/fastllm-proxy/proxy

jobs:
  test:
    runs-on: arc-azrtydxb
    timeout-minutes: 60
    # The runner image ships no Rust, so the toolchain comes from a container —
    # same base as the Dockerfile, so CI and the image agree on the compiler.
    container:
      image: rust:1-bookworm
    env:
      # Kept in the workspace so the cargo config written below lands somewhere
      # predictable and writable. It is no longer cached — dependency sources
      # come from the Nexus cargo proxy and compiled artifacts from sccache,
      # both on the LAN. The `cargo` binary itself stays on PATH from the image.
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      # sccache config. Set at job level rather than written into $GITHUB_ENV so
      # the password is not persisted to a file on the runner.
      RUSTC_WRAPPER: /usr/local/bin/sccache
      # S3 against MinIO, not WebDAV against Nexus. The WebDAV backend cannot
      # work here: opendal issues MKCOL to create the parent collection and a
      # Nexus raw repo answers 405, having no notion of collections. One run
      # proved it server-side — 241 GET/404, 1 MKCOL/405, and 3 PUT/201 out of
      # 919 attempted writes, with `Cache write errors 919` in the stats.
      SCCACHE_BUCKET: sccache
      SCCACHE_ENDPOINT: http://192.168.10.134:9000
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET }}
      SECRET_LEN_TEST: ${{ secrets.SECRET_LEN_TEST }}
    # A sibling service container, reachable by its service name — not
    # localhost, which is the `test` container's own loopback, not the
    # runner's. Same Postgres major version CNPG runs in deploy/control.yaml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fastllm
          POSTGRES_PASSWORD: fastllm
          POSTGRES_DB: fastllm
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Nothing in this job round-trips to GitHub any more: dependency sources
      # come from the Nexus cargo proxy and compiled artifacts from sccache,
      # both on the LAN. Both need to trust the cluster CA.
      #
      # It goes into the system trust store rather than per-tool env vars,
      # because those only cover tools that read them: sccache is a Rust binary
      # whose TLS backend may ignore SSL_CERT_FILE, and it fails soft — a trust
      # error there would silently disable caching instead of failing the build.
      # One insecure fetch, and everything after it verifies.
      - name: Trust the cluster CA
        run: |
          curl -sk -o /usr/local/share/ca-certificates/cluster-ca.crt \
            https://192.168.10.131:8443/repository/public/cluster-ca.crt
          update-ca-certificates
          echo "CARGO_HTTP_CAINFO=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
      # The remote behind this proxy is index.crates.io, not crates.io — a
      # proxy pointed at the latter serves the web API but no sparse index,
      # and cargo cannot use it at all.
      - name: Point cargo at the local proxy
        run: |
          mkdir -p "$CARGO_HOME"
          cat >> "$CARGO_HOME/config.toml" <<'EOF'
          [source.crates-io]
          replace-with = "nexus"

          [source.nexus]
          registry = "sparse+https://192.168.10.131:8443/repository/cargo/"
          EOF
      # sccache instead of actions/cache. The problem with actions/cache here was
      # not the upload alone, it is that the cache is remote at all: on the last
      # run it restored nothing (2s miss), compiled everything from scratch, and
      # then spent 417s uploading to GitHub — a net loss of about seven minutes.
      # Even a hit means dragging ~2 GB back across a 100 Mbit link.
      #
      # sccache keeps compilation units in a Nexus raw repo on the LAN, so hits
      # are cheap in both directions. Installed before any cargo command so
      # every invocation below is wrapped.
      # Preflight. sccache fails with an opaque "Server startup failed" and a
      # bare status code, which does not distinguish a wrong secret from an
      # empty one from a missing bucket — and it kills the build at the first
      # cargo invocation, so it reads as a compiler problem. This says which,
      # printing only the lengths of the values rather than the values.
      #
      # It has already earned its keep once: it caught a password stored 10
      # characters long instead of 11, because a shell ate the trailing "!".
      - name: Check object store credentials
        run: |
          echo "key length=${#AWS_ACCESS_KEY_ID}  secret length=${#AWS_SECRET_ACCESS_KEY}"
          # Temporary control: a known 11-character org secret. If this also
          # reports 1, the fault is in how the value is read here, not in how
          # the secret was set. Remove once the cause is established.
          echo "control secret length=${#SECRET_LEN_TEST} (expect 11)"
          code=$(curl -s -o /dev/null -w '%{http_code}' "${SCCACHE_ENDPOINT}/minio/health/live")
          echo "MinIO health -> $code"
          [ "$code" = "200" ] || { echo "::error::MinIO unreachable at ${SCCACHE_ENDPOINT}"; exit 1; }
          # Length, not merely non-empty. Every credential mishap here so far has
          # been a truncation rather than an absence: a password stored as 10
          # characters instead of 11 when a shell ate a trailing "!", and a
          # secret stored as 1 character when a prompt did not capture. MinIO
          # itself refuses anything under 8, so this can never be a false alarm.
          [ ${#AWS_ACCESS_KEY_ID} -ge 3 ] \
            || { echo "::error::SCCACHE_S3_KEY looks wrong (length ${#AWS_ACCESS_KEY_ID})"; exit 1; }
          [ ${#AWS_SECRET_ACCESS_KEY} -ge 8 ] \
            || { echo "::error::SCCACHE_S3_SECRET is ${#AWS_SECRET_ACCESS_KEY} characters; MinIO requires at least 8. The secret was probably truncated when it was set."; exit 1; }
      - name: Install sccache
        run: |
          SCCACHE_VERSION=0.17.0
          curl -sL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-$(uname -m)-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp --strip-components=1 --wildcards '*/sccache'
          install -m755 /tmp/sccache /usr/local/bin/sccache
          sccache --version
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      # The Claude skills in .claude/skills carry a generated endpoint table
      # derived from openapi.json and the axum route table. Regenerating here
      # rather than trusting it: a skill that has quietly stopped matching the
      # API is worse than no skill, and this also fails when a newly added
      # endpoint belongs to no skill at all.
      - name: Skills up to date
        # rust:1-bookworm ships no python3, so install it rather than let the
        # step fail for a reason unrelated to what it checks.
        run: |
          command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3; }
          python3 scripts/gen-claude-skills.py --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      # The database tests are `#[ignore]`d by default so `cargo test` stays
      # database-free everywhere else (a laptop with no Postgres running,
      # `cargo build --no-default-features`). Here, with a real Postgres
      # alongside, `--include-ignored` actually runs them.
      - name: Test (with database)
        env:
          DATABASE_URL: postgres://fastllm:fastllm@postgres:5432/fastllm
          # Every process that talks to Postgres takes a whole *pool*, not a
          # connection. `cargo test` runs each test binary's tests in parallel
          # and several binaries at once, and each spawned proxy plus each
          # library test's own pool counts — which at the default of 8 adds up
          # past this Postgres's 100 and presents as an unrelated test failing
          # to connect. The end-to-end tests already pin this per spawned
          # process; this covers the library tests' own pools too.
          FASTLLM_DATABASE_MAX_CONNECTIONS: "2"
        run: cargo test --features control --locked -- --include-ignored
      # Semantic routing is behind a feature, so the run above never compiles
      # it — and a test that needs it is `#[cfg]`d out rather than failing for
      # the wrong reason. This run is what actually exercises it.
      #
      # The classifier model comes from HuggingFace on first use. The ARC
      # runners are ephemeral pods, so "cached by the runner" lasts exactly
      # one pod — without this cache every fresh pod re-downloads the model
      # inside the semantic-routing test's health window and the test dies
      # waiting. HF_HOME pins the cache somewhere actions/cache can see.
      - name: Cache the classifier model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hf-cache
          key: hf-potion-code-16m
      - name: Clippy (classifier)
        run: cargo clippy --all-targets --features "control classifier-tier2" -- -D warnings
      - name: Test (classifier)
        env:
          DATABASE_URL: postgres://fastllm:fastllm@postgres:5432/fastllm
          FASTLLM_DATABASE_MAX_CONNECTIONS: "2"
          HF_HOME: ${{ github.workspace }}/.hf-cache
        run: cargo test --features "control classifier" --locked -- --include-ignored
      # Prints hits, misses and cache size. Without this the cache is invisible
      # and there is no way to tell whether it is earning its keep.
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # A separate job with its own container, so the Rust job stays Node-free —
  # the same reason the Dockerfile builds the UI in a dedicated stage rather
  # than shelling out to npm from a build.rs.
  ui:
    runs-on: arc-azrtydxb
    timeout-minutes: 15
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # This job had no dependency caching at all, so every run pulled the
      # whole tree from registry.npmjs.org. The proxy serves it from the LAN
      # and, unlike actions/cache, uploads nothing.
      - name: Trust the cluster CA and use the local npm proxy
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates
          curl -sk -o /tmp/cluster-ca.crt \
            https://192.168.10.131:8443/repository/public/cluster-ca.crt
          npm config set registry https://192.168.10.131:8443/repository/npmjs/
          npm config set cafile /tmp/cluster-ca.crt
      - name: Install
        working-directory: web
        run: npm install
      # Two harnesses. `render` mounts every screen against stubbed responses
      # shaped like the ones `control::api` serialises; `interact` clicks every
      # control and asserts the method, path and body each one sends. The
      # second exists because the worst bug this UI has had was a correct-
      # looking screen posting a body serde silently discarded — nothing
      # rendered wrong, and no test had ever looked at a request body.
      - name: Screen and interaction checks
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build

  publish:
    # Only what lands on main or a tag becomes an image; a PR just gets tested.
    if: github.event_name != 'pull_request'
    needs: [test, ui]
    runs-on: arc-azrtydxb-publish
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Every build gets an immutable sha- tag. The moving `main` tag and a
      # semver tag are only added when the ref actually warrants them, so a
      # workflow_dispatch on a branch cannot quietly redefine what `:main` is.
      - name: Compute tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            [ "${GITHUB_REF}" = "refs/heads/main" ] && echo "${IMAGE}:main"
            [ "${GITHUB_REF_TYPE}" = "tag" ] && echo "${IMAGE}:${GITHUB_REF_NAME#v}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # The operator image is tagged from the same commit, so it needs the
          # short sha as its own output rather than parsed back out of `tags`.
          echo "short=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.IMAGE }}

      # setup-buildx-action rather than `docker buildx create`: it installs a
      # current standalone buildx, where a cache-from ref that does not exist
      # yet is a warning. The docker CLI plugin on the runner treats it as
      # fatal — "failed to configure registry cache importer: ... not found" —
      # which blocked every publish after the old Zot buildcache went away.
      - name: Set up buildx (Nexus insecure, Docker Hub via cluster mirror)
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/arm64
          buildkitd-config-inline: |
            # Both ports. Nexus fronts two things: :443 is the read-only group
            # that carries the docker.io proxy the mirror below points at, and
            # :5000 is the hosted repository, the only one that accepts a push.
            # BuildKit runs in its own container and does not inherit the host
            # trust store, so each needs the exemption. Without the :443 entry
            # the mirror fails TLS and BuildKit silently falls back to Docker
            # Hub — no error, and no benefit either.
            [registry."192.168.10.131"]
              insecure = true
            [registry."192.168.10.131:5000"]
              insecure = true
            # Base images come through the Nexus pull-through cache rather than
            # hitting Docker Hub anonymously and collecting 429s.
            [registry."docker.io"]
              mirrors = ["192.168.10.131"]

      # GHCR as well as the private registry, but only for a tagged release.
      # Every commit to main pushes to zot because this cluster deploys from
      # it continuously; publishing every commit publicly would make "latest"
      # mean "whatever landed most recently", which is the drift that already
      # cost this project a downgraded control plane.

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Public tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: public
        run: |
          v="${GITHUB_REF#refs/tags/}"
          echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}:${v},ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      # build-push-action v7, not v6. v6 treats a cache-from ref that does not
      # exist as fatal — "failed to configure registry cache importer: ...
      # not found" — which blocked every publish once the old Zot buildcache
      # went away. v7 tolerates it, which is what novamem does against an
      # identically missing cache.
      # Nexus needs credentials to push. The Zot registry it replaced accepted
      # anonymous writes, so this workflow only ever logged in to GHCR — the
      # push now fails with "unauthorized: access to the requested resource is
      # not authorized" without this. Pulls stay anonymous, so the Deployments
      # still need no imagePullSecret.
      - name: Log in to Nexus
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build & push (arm64 → zot)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # arm64 only: every node in kw is arm64, and a Rust release build
          # under QEMU is not worth the wall clock.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/fastllm-proxy:arm64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/buildcache/fastllm-proxy:arm64,mode=max,image-manifest=true,ignore-error=true

      # The operator is a second image on the same release cycle. Small and
      # fast to build — no UI stage, no classifier models — so it rides along
      # rather than getting its own workflow.
      - name: Build & push the operator (arm64 → zot)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: operator/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/azrtydxb/fastllm-proxy/operator:${{ steps.meta.outputs.short }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/buildcache/fastllm-operator:arm64
          cache-to: type=registry,ref=${{ env.REGISTRY }}/buildcache/fastllm-operator:arm64,mode=max,image-manifest=true,ignore-error=true

  # ---------------------------------------------------------------- release
  #
  # A tag builds each architecture on a runner that *is* that architecture and
  # merges the two digests into one manifest. The previous attempt emulated
  # amd64 with QEMU and rustc segfaulted before compiling anything — there is
  # an amd64 runner, so there was never a reason to emulate.
  #
  # Split into three jobs rather than one `platforms: linux/amd64,linux/arm64`
  # because the two legs run on different machines; `push-by-digest` is what
  # lets them be assembled afterwards.

  release-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, ui]
    runs-on: arc-azrtydxb-publish
    timeout-minutes: 60
    permissions: { contents: read, packages: write }
    outputs:
      proxy: ${{ steps.proxy.outputs.digest }}
      operator: ${{ steps.operator.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Local arm64 builder
        run: |
          docker buildx create --name local-arm64 --driver docker-container \
            --platform linux/arm64 --use
          docker buildx inspect --bootstrap local-arm64
      - name: Proxy (arm64, digest only)
        id: proxy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          builder: local-arm64
          platforms: linux/arm64
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/fastllm-proxy",push-by-digest=true,name-canonical=true,push=true
      - name: Operator (arm64, digest only)
        id: operator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: operator/Dockerfile
          builder: local-arm64
          platforms: linux/arm64
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/fastllm-operator",push-by-digest=true,name-canonical=true,push=true

  release-amd64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, ui]
    runs-on: arc-azrtydxb-amd64-publish
    timeout-minutes: 60
    permissions: { contents: read, packages: write }
    outputs:
      proxy: ${{ steps.proxy.outputs.digest }}
      operator: ${{ steps.operator.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built natively, not through a remote buildkit. Another repository on
      # this cluster points this runner at a remote amd64 endpoint via
      # `BUILDKIT_AMD64_ENDPOINT` and a client certificate in the runner's
      # environment; those variables are not set for this repository, and this
      # runner is amd64 itself, so there is nothing to reach out to.
      - name: Local amd64 builder
        run: |
          docker buildx create --name local-amd64 --driver docker-container \
            --platform linux/amd64 --use
          docker buildx inspect --bootstrap local-amd64
      - name: Proxy (amd64, digest only)
        id: proxy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          builder: local-amd64
          platforms: linux/amd64
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/fastllm-proxy",push-by-digest=true,name-canonical=true,push=true
      - name: Operator (amd64, digest only)
        id: operator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: operator/Dockerfile
          builder: local-amd64
          platforms: linux/amd64
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/fastllm-operator",push-by-digest=true,name-canonical=true,push=true

  release-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-arm64, release-amd64]
    runs-on: arc-azrtydxb-publish
    timeout-minutes: 15
    permissions: { contents: read, packages: write }
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and verify both manifests
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assemble() {
            local image="ghcr.io/${OWNER}/$1" arm="$2" amd="$3"
            docker buildx imagetools create \
              -t "${image}:${VERSION}" -t "${image}:latest" \
              "${image}@${arm}" "${image}@${amd}"
            # Both architectures, asserted rather than assumed: a manifest that
            # claims an architecture it does not carry is worse than one that
            # never claimed it.
            local archs
            archs=$(docker buildx imagetools inspect --raw "${image}:${VERSION}" \
                    | grep -o '"architecture": *"[a-z0-9]*"' | sort -u)
            echo "$archs"
            echo "$archs" | grep -q 'arm64'
            echo "$archs" | grep -q 'amd64'
          }
          assemble fastllm-proxy "${{ needs.release-arm64.outputs.proxy }}" "${{ needs.release-amd64.outputs.proxy }}"
          assemble fastllm-operator "${{ needs.release-arm64.outputs.operator }}" "${{ needs.release-amd64.outputs.operator }}"
